{% if page.previous or page.next %}<nav class="post-nav" aria-label="More writing">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><span>← Previous article</span><strong>{{ page.previous.title | escape }}</strong></a>{% endif %}
  {% if page.next %}<a href="{{ page.next.url | relative_url }}"><span>Next article →</span><strong>{{ page.next.title | escape }}</strong></a>{% endif %}
</nav>{% endif %}
