<article class="post-card"{% if include.search %} data-search="{{ include.post.title | escape }} {{ include.post.description | escape }} {{ include.post.tags | join: ' ' | escape }}"{% endif %}>
  <div class="post-card-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%d %b %Y' }}</time><span>{% include reading-time.html content=include.post.content %}</span></div>
  <div class="post-card-content"><p class="eyebrow">{{ include.post.tags.first | default: 'Field notes' | escape }}</p><h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3><p>{{ include.post.description | escape }}</p></div>
  <span class="post-card-arrow" aria-hidden="true">↗</span>
</article>
