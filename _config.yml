title: 0xHMZA
description: Security, systems, and the people in between.
lang: en-US
timezone: Europe/Berlin
url: "https://0xhmza.github.io"
baseurl: ""
permalink: /:title/
image: /assets/favicons/android-chrome-384x384.png

author:
  name: Hamza
  github: 0xhmza
  avatar: /assets/img/avatar.jpg

collections:
  projects:
    output: true
    permalink: /projects/:name/

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

number_of_posts: 5
sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - scripts
  - docs
  - test.html
  - assets/img/projects
  - "*.conflict-cloud"

plugins:
  - jekyll-feed
  - jekyll-sitemap
