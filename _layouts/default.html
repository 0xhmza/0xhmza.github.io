<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-theme="dark">
{% include header.html %}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include navbar.html %}
  <main id="main" class="site-main wrapper" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if content contains 'data-project-title' %}
  <script src="{{ '/assets/js/project-art.js' | relative_url }}" defer></script>
  {% endif %}
  {% if content contains 'language-mermaid' or content contains 'class="mermaid"' %}
  <script type="module" src="{{ '/assets/js/diagrams.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
