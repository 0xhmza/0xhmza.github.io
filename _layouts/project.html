---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: " en " }}">

{% include header.html %}

<body data-theme="{{ site.mode }}" class="notransition project-detail-view">
  <script>
    const body = document.body;
    const data = body.getAttribute("data-theme");

    const initTheme = (state) => {
      if (state === "dark") {
        body.setAttribute("data-theme", "dark");
      } else if (state === "light") {
        body.removeAttribute("data-theme");
      } else {
        localStorage.setItem("theme", data);
      }
    };
 
    initTheme(localStorage.getItem("theme"));
    
    setTimeout(() => body.classList.remove("notransition"), 75);
  </script>

  {% include navbar.html %}
  <div class="wrapper">
    <article class="project-detail">
      <header class="project-detail__header">
        <div
          class="project-detail__media project-cover"
          data-title="{{ page.title | escape }}"
          data-date="{{ page.date | date: "%b %d, %Y" }}"
        ></div>
        <h1 class="sr-only">{{ page.title | escape }}</h1>
        <p class="sr-only">{{ page.date | date: "%b %d, %Y" }}</p>
      </header>
      <main class="page-content project-detail__content" aria-label="Content">
        {% include anchor_headings.html html=content anchorClass="anchor-head" beforeHeading=true h_min=2 h_max=4 %}
      </main>
    </article>
    {% include footer.html %}
  </div>
  <script src="/assets/js/project-covers.js" defer></script>
</body>

</html>
